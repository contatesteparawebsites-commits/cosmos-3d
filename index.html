<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8ef"><title>Tem em Casa</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#fff8ef,#f7efe5);color:#28231f;min-height:100vh}main{width:min(1000px,92%);margin:auto;padding:42px 0 70px}.hero{text-align:center;margin-bottom:30px}.badge{display:inline-block;padding:7px 13px;border-radius:99px;background:#ffe2bf;color:#9a5317;font-size:12px;font-weight:800;letter-spacing:.08em}.hero h1{font-size:clamp(38px,7vw,70px);line-height:.95;margin:16px 0 12px;letter-spacing:-.05em}.hero p{margin:auto;max-width:650px;color:#766d65;font-size:18px}.box{background:#fff;border:1px solid #eadfd4;border-radius:28px;padding:25px;box-shadow:0 18px 55px #6b4b2714}.label{font-weight:800;font-size:15px;margin-bottom:12px;display:block}.inputrow{display:flex;gap:10px}.inputrow input{flex:1;border:1px solid #ddd0c3;border-radius:16px;padding:15px 17px;font-size:16px;outline:none}.inputrow input:focus{border-color:#e48b42;box-shadow:0 0 0 4px #e48b4218}.add,.primary{border:0;border-radius:16px;padding:0 20px;font-weight:800;cursor:pointer;background:#f08a3c;color:#fff;font-size:15px}.ingredients{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 5px}.chip{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:99px;background:#fff1e3;border:1px solid #f5d2b0;color:#8b4c1d;font-weight:700}.chip button{border:0;background:none;color:#b46b38;cursor:pointer;font-size:17px}.primary{width:100%;height:54px;margin-top:18px;font-size:16px;box-shadow:0 9px 22px #f08a3c33}.result{margin-top:24px;display:none}.result.show{display:block}.recipe{display:grid;grid-template-columns:1.1fr 1fr;gap:25px;align-items:stretch}.visual{min-height:310px;border-radius:23px;background:linear-gradient(145deg,#ffd29e,#f39a55);display:flex;align-items:center;justify-content:center;font-size:110px}.content h2{font-size:34px;letter-spacing:-.03em;margin:0 0 8px}.content p{color:#766d65;line-height:1.6}.match{display:inline-block;background:#e9f7e7;color:#34702f;border-radius:99px;padding:7px 11px;font-weight:800;font-size:13px}.list{padding-left:20px;line-height:1.9}.again{border:1px solid #ead4c0;background:#fff;color:#8b4c1d;border-radius:14px;padding:11px 15px;font-weight:800;cursor:pointer}@media(max-width:700px){.recipe{grid-template-columns:1fr}.visual{min-height:200px;font-size:80px}.inputrow{flex-direction:column}.add{height:50px}}
</style></head><body><main><section class="hero"><span class="badge">COZINHA INTELIGENTE</span><h1>O que dá pra fazer<br>com o que você tem?</h1><p>Digite os ingredientes que estão na sua cozinha e descubra uma ideia deliciosa para preparar agora.</p></section><section class="box"><label class="label">🥕 Seus ingredientes</label><div class="inputrow"><input id="ingredient" placeholder="Ex.: arroz, ovo, tomate..."><button class="add" id="add">Adicionar</button></div><div class="ingredients" id="ingredients"></div><button class="primary" id="find">✨ Encontrar uma receita</button></section><section class="box result" id="result"><div class="recipe"><div class="visual" id="emoji">🍳</div><div class="content"><span class="match" id="match"></span><h2 id="name"></h2><p id="desc"></p><strong>Você vai usar</strong><ul class="list" id="list"></ul><button class="again" id="again">🔄 Outra ideia</button></div></div></section></main><script>const recipes=[{name:'Omelete turbinada',emoji:'🍳',need:['ovo','tomate','queijo','cebola'],desc:'Uma omelete rápida, cremosa e perfeita para aproveitar ingredientes da geladeira.'},{name:'Arroz de frigideira',emoji:'🍚',need:['arroz','ovo','cebola','cenoura'],desc:'Transforme o arroz que sobrou em uma refeição completa e cheia de sabor.'},{name:'Macarrão cremoso',emoji:'🍝',need:['macarrão','tomate','queijo','creme de leite'],desc:'Um macarrão simples e cremoso que fica pronto em poucos minutos.'},{name:'Sanduíche caprichado',emoji:'🥪',need:['pão','queijo','tomate','ovo'],desc:'Um lanche quente, crocante e fácil para matar a fome.'},{name:'Panqueca simples',emoji:'🥞',need:['ovo','farinha','leite'],desc:'Massa básica e versátil para uma refeição ou lanche delicioso.'},{name:'Batata recheada',emoji:'🥔',need:['batata','queijo','cebola','presunto'],desc:'Batata macia por dentro, douradinha por fora e cheia de recheio.'}];let items=[];const $=id=>document.getElementById(id);function render(){ $('ingredients').innerHTML=items.map((x,i)=>`<span class="chip">${x}<button onclick="removeItem(${i})">×</button></span>`).join('')}window.removeItem=i=>{items.splice(i,1);render()};function add(){const v=$('ingredient').value.trim().toLowerCase();if(v&&!items.includes(v)){items.push(v);render()}$('ingredient').value='';$('ingredient').focus()}$('add').onclick=add;$('ingredient').addEventListener('keydown',e=>{if(e.key==='Enter')add()});function find(){if(!items.length){$('ingredient').focus();return}let best=recipes[0],score=-1;recipes.forEach(r=>{const s=r.need.filter(n=>items.some(i=>i.includes(n)||n.includes(i))).length;if(s>score){score=s;best=r}});const percent=Math.round(score/best.need.length*100);$('emoji').textContent=best.emoji;$('name').textContent=best.name;$('desc').textContent=best.desc;$('match').textContent=`${percent}% dos ingredientes você já tem`;$('list').innerHTML=best.need.map(n=>`<li>${n} ${items.some(i=>i.includes(n)||n.includes(i))?'✓':'— comprar'}</li>`).join('');$('result').classList.add('show');$('result').scrollIntoView({behavior:'smooth',block:'start'})}$('find').onclick=find;$('again').onclick=()=>{const shuffled=[...recipes].sort(()=>Math.random()-.5);const old=recipes.indexOf(recipes.find(r=>r.name===$('name').textContent));let r=shuffled.find(x=>x!==recipes[old])||shuffled[0];const score=r.need.filter(n=>items.some(i=>i.includes(n)||n.includes(i))).length;$('emoji').textContent=r.emoji;$('name').textContent=r.name;$('desc').textContent=r.desc;$('match').textContent=`${Math.round(score/r.need.length*100)}% dos ingredientes você já tem`;$('list').innerHTML=r.need.map(n=>`<li>${n} ${items.some(i=>i.includes(n)||n.includes(i))?'✓':'— comprar'}</li>`).join('')}</script></body></html>
